name: Deploy Database Migrations to Supabase

on:
  push:
    branches:
      - master
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/**'
  workflow_dispatch: {}

jobs:
  deploy-migrations:
    name: Apply Supabase Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Link & Push Migrations to Supabase Cloud
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "❌ Missing required Supabase GitHub Secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_ID, SUPABASE_DB_PASSWORD"
            echo "Please configure them in Repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          npx --yes supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          npx --yes supabase db push --password "$SUPABASE_DB_PASSWORD" --include-all
