      <header>
        <h1>KancaSela - Teman Meja Main Serba Bisa</h1>
        <p>Aplikasi web & mobile pendamping main kartu, catur, dan aneka permainan meja.</p>
      </header>
      <main>
        <section>
          <h2>Fitur & Modul Permainan</h2>
          <ul>
            <li><strong>Kartu Truf</strong>: Kalkulator skor otomatis, tracking kontrak/bid, dan multiplayer room.</li>
            <li><strong>Remi 7-Card</strong>: Pencatat poin kombinasi kartu remi tradisional.</li>
            <li><strong>Omben (Cangkulan)</strong>: Sistem pencatatan skor babak dan hukuman sisa kartu.</li>
            <li><strong>Jam Catur Digital (Chess Clock)</strong>: Timer catur presisi dengan pilihan preset Blitz, Rapid, dan Custom increment (Fischer/Delay).</li>
            <li><strong>Papan Skor Universal (Scoreboard)</strong>: Pencatat poin fleksibel untuk futsal, badminton, pingpong, dan board game.</li>
            <li><strong>Utilitas</strong>: Lempar dadu digital (3D Dices) dan lempar koin (Coin Flip).</li>
          </ul>
        </section>
